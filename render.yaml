services:
  # ── Node.js Express Backend ─────────────────────────────────────────────────
  - type: web
    name: stockverse-ai-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        value: https://stockverse-ai-ml.onrender.com
      - key: FRONTEND_URL
        value: https://stock-verse-ai-xxod.vercel.app

  # ── Python FastAPI ML Service ────────────────────────────────────────────────
  - type: web
    name: stockverse-ai-ml
    env: python
    region: singapore
    plan: free
    rootDir: backend/python-ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
